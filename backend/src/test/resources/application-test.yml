# Test profile uses the same local PostgreSQL as default dev (see B2 plan).
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/focusflow}
    username: ${SPRING_DATASOURCE_USERNAME:focusflow}
    password: ${SPRING_DATASOURCE_PASSWORD:focusflow}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

focusflow:
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4.1-mini}
