plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.5'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.focusflow'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:postgresql'
	testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.0'
}

tasks.named('test') {
	useJUnitPlatform()
}

def normalizeDotEnvValue(value) {
	if (value.length() >= 2) {
		if (value.startsWith('"') && value.endsWith('"')) {
			return value.substring(1, value.length() - 1)
		}
		if (value.startsWith("'") && value.endsWith("'")) {
			return value.substring(1, value.length() - 1)
		}
	}
	if (value == '"' || value == "'") {
		return null
	}
	return value
}

def loadRepoDotEnv() {
	def envFile = rootProject.projectDir.parentFile.toPath().resolve('.env').toFile()
	if (!envFile.exists()) {
		return [:]
	}

	def loaded = [:]
	envFile.eachLine { line ->
		def trimmed = line.trim()
		if (trimmed.isEmpty() || trimmed.startsWith('#')) {
			return
		}

		def separatorIndex = trimmed.indexOf('=')
		if (separatorIndex <= 0) {
			return
		}

		def key = trimmed.substring(0, separatorIndex).trim()
		def value = trimmed.substring(separatorIndex + 1).trim()
		value = normalizeDotEnvValue(value)
		if (value == null) {
			logger.warn("Skipping malformed .env entry for key '${key}': unclosed quote")
			return
		}

		def systemValue = System.getenv(key)
		if (systemValue == null || systemValue.isBlank()) {
			loaded[key] = value
		}
	}

	return loaded
}

tasks.named('bootRun') {
	environment loadRepoDotEnv()
}

tasks.register('verifyDotEnvParser') {
	doLast {
		assert normalizeDotEnvValue('"') == null
		assert normalizeDotEnvValue("'") == null
		assert normalizeDotEnvValue('""') == ''
		assert normalizeDotEnvValue("'x'") == 'x'
		assert normalizeDotEnvValue('"hello"') == 'hello'
		assert normalizeDotEnvValue('plain') == 'plain'
	}
}
