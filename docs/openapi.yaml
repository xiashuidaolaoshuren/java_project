  /api/tasks/{id}:
    delete:
      operationId: "delete"
      parameters:
      - in: "path"
        name: "id"
        required: true
        schema:
          format: "int64"
          type: "integer"
      responses:
        "204":
          description: "No Content"
      tags:
      - "task-controller"
    get:
      operationId: "getById"
      parameters:
      - in: "path"
        name: "id"
        required: true
        schema:
          format: "int64"
