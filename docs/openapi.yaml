    get:
      operationId: "getById_1"
      parameters:
      - in: "path"
        name: "id"
        required: true
        schema:
          format: "int64"
          type: "integer"
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DailyPlanResponse"
          description: "OK"
      tags:
      - "daily-plan-controller"
  /api/tasks:
    get:
