components:
  schemas:
    CreateTaskRequest:
      properties:
        description:
          type: "string"
        dueDate:
          format: "date"
          type: "string"
        estimatedMinutes:
          format: "int32"
          type: "integer"
        priority:
          enum:
          - "LOW"
          - "MEDIUM"
          - "HIGH"
          type: "string"
        title:
          minLength: 1
          type: "string"
      type: "object"
    DailyPlanItemResponse:
      properties:
        position:
          format: "int32"
          type: "integer"
        task:
          $ref: "#/components/schemas/TaskResponse"
      type: "object"
    DailyPlanResponse:
      properties:
        availableMinutes:
          format: "int32"
          type: "integer"
        createdAt:
          format: "date-time"
          type: "string"
        id:
          format: "int64"
          type: "integer"
        items:
          items:
            $ref: "#/components/schemas/DailyPlanItemResponse"
          type: "array"
        planDate:
          format: "date"
          type: "string"
        warning:
          $ref: "#/components/schemas/DailyPlanWarning"
      type: "object"
    DailyPlanSummaryResponse:
      properties:
        availableMinutes:
          format: "int32"
          type: "integer"
        createdAt:
          format: "date-time"
          type: "string"
        hasWarning:
          type: "boolean"
        id:
          format: "int64"
          type: "integer"
        itemCount:
          format: "int32"
          type: "integer"
        planDate:
          format: "date"
          type: "string"
      type: "object"
    DailyPlanWarning:
      properties:
        estimatedTasks:
          items:
            $ref: "#/components/schemas/EstimatedTask"
          type: "array"
        minimumAvailableMinutes:
          format: "int32"
          type: "integer"
        unestimatedTasks:
          items:
            $ref: "#/components/schemas/UnestimatedTask"
          type: "array"
      type: "object"
    EstimatedTask:
      properties:
        estimatedMinutes:
          format: "int32"
          type: "integer"
        taskId:
          format: "int64"
          type: "integer"
        title:
          type: "string"
      type: "object"
    GeneratePlanRequest:
      properties:
        availableMinutes:
          format: "int32"
          minimum: 1
          type: "integer"
        planDate:
          format: "date"
          type: "string"
      required:
      - "availableMinutes"
      - "planDate"
      type: "object"
    LoginRequest:
      properties:
        password:
          minLength: 1
          type: "string"
        username:
          minLength: 1
          type: "string"
      type: "object"
    PageResponseDailyPlanSummaryResponse:
      properties:
        content:
          items:
            $ref: "#/components/schemas/DailyPlanSummaryResponse"
          type: "array"
        page:
          format: "int32"
          type: "integer"
        size:
          format: "int32"
          type: "integer"
        totalElements:
          format: "int64"
          type: "integer"
        totalPages:
          format: "int32"
          type: "integer"
      type: "object"
    RegisterRequest:
      properties:
        email:
          minLength: 1
          type: "string"
        password:
          maxLength: 2147483647
          minLength: 8
          type: "string"
        username:
          maxLength: 30
          minLength: 3
          type: "string"
      type: "object"
    TaskResponse:
      properties:
        description:
          type: "string"
        dueDate:
          format: "date"
          type: "string"
        estimatedMinutes:
          format: "int32"
          type: "integer"
        id:
          format: "int64"
          type: "integer"
        priority:
          enum:
          - "LOW"
          - "MEDIUM"
          - "HIGH"
          type: "string"
        status:
          enum:
          - "OPEN"
          - "IN_PROGRESS"
          - "DONE"
          - "CANCELLED"
          type: "string"
        title:
          type: "string"
      type: "object"
    UnestimatedTask:
      properties:
        taskId:
          format: "int64"
          type: "integer"
        title:
          type: "string"
      type: "object"
    UpdateTaskRequest:
      properties:
        description:
          type: "string"
        dueDate:
          format: "date"
          type: "string"
        estimatedMinutes:
          format: "int32"
          type: "integer"
        priority:
          enum:
          - "LOW"
          - "MEDIUM"
          - "HIGH"
          type: "string"
        status:
          enum:
          - "OPEN"
          - "IN_PROGRESS"
          - "DONE"
          - "CANCELLED"
          type: "string"
        title:
          minLength: 1
          type: "string"
      type: "object"
    UserResponse:
      properties:
        email:
          type: "string"
        id:
          format: "int64"
          type: "integer"
        username:
          type: "string"
      type: "object"
    ValidationDto:
      properties:
        name:
          minLength: 1
          type: "string"
      type: "object"
info:
